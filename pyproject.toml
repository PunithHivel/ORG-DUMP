[project]
name = "org-dump"
version = "0.1.0"
description = "Export all records for a specific organization from a PostgreSQL schema"
requires-python = ">=3.11"
dependencies = [
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "click>=8.1",
    "rich>=13.0",
]

[project.scripts]
org-dump = "main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["org_dump"]
